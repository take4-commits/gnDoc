# gnDocRd の使い方の見本

このページは、**gnDocRd.js**（gnDoc 記法の描画ライブラリ）で Markdown を描いた見本です。
下の記法は gnDoc（gnDoc.exe）と同じ見た目で描かれます。

> [!NOTE]
> 記法の詳しい仕様は、**gnDoc.exe 付属のドキュメント**（❓ ヘルプの 📖 ReadMe・⌨️ チートシート・📊 サンプル集）を見てください。

## 1. 使い方

同じフォルダに `gnDocRd-libs.js`（頼るライブラリ。`gnDocRdLibGen.html` で作る）と `gnDocRd.js` を置き、この順で読み込みます。

```html
<script src="gnDocRd-libs.js"><\/script>
<script src="gnDocRd.js"><\/script>

<div id="out"></div>
<script>
  gnDocRd.render('#out', '# 見出し\n\n{red:赤い字} と [[枠囲み]]');
<\/script>
```

ページの中に Markdown を書くときは `<script type="text/markdown">` に入れて `gnDocRd.renderScripts()` を呼びます（このページのやり方）。
その中で script の閉じの札を書くときは、`/` の前に `\` を入れます（入れないと、そこで外側の札が終わってしまうため。上の例もそう書いてあります）。

| 入口 | 働き |
| :--- | :--- |
| `await gnDocRd.render(描く先, Markdown)` | 描く先（要素か選択子）へ描く。図・線まで描き終えてから戻る |
| `await gnDocRd.renderScripts()` | `<script type="text/markdown">` の中身を、その直後（`data-target` があればその先）へ描く。このページはこれ |
| `gnDocRd.toHtml(Markdown)` | HTML の文字列だけ（図はまだ描かれていない） |

外部サーバーで描く図（PlantUML・DBML・D2・Graphviz）は、**既定では送りません**（図のソースが外へ出るため）。
使うときは送り先を渡します: `gnDocRd.render('#out', md, { endpoints: { plantuml: 'https://kroki.io/plantuml' } })`。

## 9. 印刷

描いた文書は、**Ctrl+P（ブラウザの印刷）で gnDoc と同じ紙面**になります（`render` が自動で結び付けます。`{ print: false }` で付けない）。

| 入口 | 働き |
| :--- | :--- |
| `gnDocRd.render(描く先, md, { print: 設定 })` | 描いて、Ctrl+P の紙面を設定どおりにする |
| `gnDocRd.print.enable(描く先, 設定)` | あとから設定を変える（このページの「印刷」の帯はこれ） |
| `await gnDocRd.print.openCopy(描く先, 設定)` | 🖨 と同じく、写しを新しい窓で開いて刷る |
| `await gnDocRd.print.copyHtml(描く先, 設定)` | 写しの文書（HTML の文字列）。PDF を作る道具へ渡すときなど |

設定: `header`（上に文書名と日時）・`footer`（下にページ番号）・`name`（文書名。「PDF に保存」の既定のファイル名にも）・`watermark`（透かし。`'下書き'` か `{ text, layout: 'tile', layer: 'back', opacity: 15, size: 150 }`）。

- **図は紙の幅いっぱい**に刷ります。縦に長い図は頁の高さに合わせて縮め、小さい図は元の大きさより広げません
- 図ごとの印刷の幅は、フェンスに `{print=60%}` と書きます（下の図）
- 文書の中に `<!-- gd-watermark: 下書き 敷き詰め 背面 15% -->` と書くと、その文書だけ透かしが付きます（行の頭に書く）
- 文書の中のリンク（`[…](#見出し)`）は、「PDF に保存」した PDF の中でも飛べます。改ページは `<PB>`

```flow{print=60%}
[描く]{青}
->
[刷る]{緑}
```

### 単一HTMLの書き出し

描いた文書を、**1つのファイルで開ける HTML** にできます（図は描いた物のまま入り、ライブラリは要りません。gnDoc の 💾🌐 と同じ物）。

| 入口 | 働き |
| :--- | :--- |
| `await gnDocRd.exportHtml(描く先, 設定)` | HTML の文字列 |
| `await gnDocRd.downloadHtml(描く先, 'ファイル名', 設定)` | ダウンロードする（このページの「💾 単一HTMLに書き出す」はこれ） |

設定: `name`（題名）・`toc: false`（右の見出しの一覧を付けない）・`theme: 'dark'` か `'sepia'`（地の色）・`watermark`（刷るときの透かし）。

<details>
<summary>書き出した HTML でできること</summary>

- 右の見出しの一覧から飛ぶ・折りたたみを「全展開」「全折りたたみ」で開け閉めする
- 刷ると、このページと同じ紙面（図の大きさ・透かし）になる
- 外部サーバーで描いた図（PlantUML など）の画像も中に入る

</details>

<script>
(async () => {
    const sample = document.getElementById('sample-md');
    const src = document.getElementById('src');
    // 頼るライブラリが無い（gnDocRd-libs.js を置いていない・読み込めない）
    if (typeof gnDocRd === 'undefined' || !gnDocRd.marked) {
        document.getElementById('libs-missing').classList.add('show');
        return;
    }
    // 印刷の設定（帯の値）。透かしが空なら、文書の中の指定（<!-- gd-watermark: … -->）があるときだけ付く
    const printOpts = () => ({
        header: document.getElementById('pr-header').checked,
        footer: document.getElementById('pr-footer').checked,
        name: 'gnDocRd の使い方の見本',
        watermark: document.getElementById('pr-wm').value.trim() || undefined,
    });
    // ページの中の Markdown を描く（Ctrl+P の紙面も、この設定で結び付く）
    await gnDocRd.renderScripts(undefined, { print: printOpts() });
    // 帯の値を変えたら、印刷の設定を変える
    document.getElementById('print-bar').addEventListener('change', () => gnDocRd.print.enable('#doc', printOpts()));
    document.getElementById('pr-open').addEventListener('click', () => gnDocRd.print.openCopy('#doc', printOpts()));
    document.getElementById('ex-html').addEventListener('click', () => gnDocRd.downloadHtml('#doc', 'gnDocRd-見本.html', printOpts()));
    // 書き換えて描き直す（見本の Markdown を、そのまま textarea に）
    src.value = sample.textContent.split('<\\/script>').join('<\/script>').replace(/^\n/, '');
    document.getElementById('redraw').addEventListener('click', () => gnDocRd.render('#doc', src.value, { print: printOpts() }));
    // 新しい版を確かめる（gnDocRd.checkUpdate は呼んだときだけ通信する。force で覚えた結果を使わない）
    document.getElementById('upd-check').addEventListener('click', async () => {
        const out = document.getElementById('upd-result');
        out.textContent = '確かめています…';
        const r = await gnDocRd.checkUpdate({ force: true });
        if (r.error) out.textContent = '確かめられませんでした（' + r.error + '）';
        else if (r.newer) { out.textContent = '新しい版 ' + r.latest + ' があります（今は ' + r.current + '）。'; if (r.url) { const a = document.createElement('a'); a.href = r.url; a.textContent = 'gnDocRd.js'; a.target = '_blank'; a.rel = 'noopener'; out.append(a); } }
        else out.textContent = '最新の版です（' + r.current + '）';
    });
})();
</script>

  - name: 📄 初回セットアップ（ライブラリの生成）
    url: https://github.com/take4-commits/gnDoc/blob/main/README.md#22-初めて起動したときライブラリの生成
    about: >-
      文書や図・数式が表示されない場合、多くは gnDocRd-libs.js・gnDoc-app-libs.js が未生成です。
